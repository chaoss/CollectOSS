name: "Functional tests"
# Runs automated test suites that ensure functionality is preserved. Any failures should prevent code from shipping.
on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

permissions:
  contents: read

jobs:
  test:
    name: test with ${{ matrix.env }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: "3.10"
            os: ubuntu-latest
            publish_coverage: false
          - env: "3.10"
            os: macos-latest
            publish_coverage: false
          - env: "3.11"
            os: ubuntu-latest
            publish_coverage: true
          - env: "3.11"
            os: macos-latest
            publish_coverage: false
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run Tests
        run: |
          uv run --python ${{ matrix.env }} pytest \
            --color=yes \
            --cov \
            --cov-report=term \
            --cov-report=xml \
            --cov-report=html

      - name: Add coverage to the job summary
        if: ${{ (success() || failure()) && matrix.publish_coverage }}
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run --python ${{ matrix.env }} coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report to GitHub
        if: ${{ (success() || failure()) && matrix.publish_coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: ${{ (success() || failure()) && matrix.publish_coverage && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  # DB-backed tests: the "Live" test classes in tests/test_application/test_db
  # are skipped in the matrix job above (no database there). They are
  # self-contained — each creates and drops its own throwaway schema — so an
  # empty scratch postgres is all they need. Service containers only work on
  # Linux runners, hence this separate job.
  db-tests:
    name: DB-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Keep the major version in sync with docker/database/Dockerfile; the
        # live tests double as pg_get_indexdef format-drift canaries.
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MATVIEW_COMPARATOR_TEST_DB: postgresql+psycopg2://test:test@localhost:5432/scratch
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Only the self-contained Live tests: the rest of test_db (e.g.
      # test_session.py) depends on the conftest.py fixtures that expect the
      # full app schema, which the scratch database does not have. The
      # non-live tests run in the matrix job above.
      - name: Run DB-backed tests
        run: |
          uv run pytest tests/test_application/test_db -k Live \
            --color=yes
