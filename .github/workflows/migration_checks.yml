name: Database migration checks

on:
  pull_request:
    branches: [main, release]
    paths:
      - "collectoss/application/schema/alembic/versions/*.py"
      - "scripts/check_migrations.py"
      - "tests/test_classes/test_migration_checks.py"
      - ".github/workflows/migration_checks.yml"

jobs:
  check-migrations:
    name: Check database migrations
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate changed migrations
        run: >-
          python scripts/check_migrations.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Test migration checker
        run: python -m unittest discover -s tests/test_classes -p 'test_migration_checks.py' -v
