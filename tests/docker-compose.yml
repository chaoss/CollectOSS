# Scratch PostgreSQL for the DB-backed ("Live") tests in
# tests/test_application/test_db/. The live test classes create and drop
# their own throwaway schemas, so no app schema is needed here — any empty
# postgres will do.
#
# Port 5435 avoids colliding with the app database (5432) and the Makefile
# test-data container (5434).
#
# Usage:
#   docker compose -f tests/docker-compose.yml up -d --wait
#   COLLECTOSS_TEST_DB=postgresql+psycopg2://test:test@localhost:5435/scratch \
#       uv run pytest tests/test_application/test_db -k Live
#   docker compose -f tests/docker-compose.yml down
#
# No volume is mounted on purpose: the data dies with the container, which
# is what you want for a scratch database.
services:
  postgres:
    # Keep the major version in sync with docker/database/Dockerfile; the
    # live tests double as pg_get_indexdef format-drift canaries, so they
    # must run against the same major version as production.
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: scratch
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d scratch"]
      interval: 5s
      timeout: 5s
      retries: 10
